[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-learning"
version = "0.1.0"
description = "Learning and experimentation with LangChain, LangGraph, Ollama and AI agents"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain==1.3.15",
    "langgraph==1.2.11",
    "langchain-community==0.4.2",
    "langchain-ollama==1.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]